name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

env:
  VERSION: ${{ inputs.version }}
  RELEASE_REF: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version input
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)*)?$ ]]; then
            echo "::error::Version must match 'vX.Y.Z' or 'vX.Y.Z-alpha.N'/'vX.Y.Z-beta.N' (e.g. v0.2.0, v0.0.1-alpha.0)"
            exit 1
          fi

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate changelog
        id: cliff
        run: |
          # Update CHANGELOG.md with all tags up to the new one
          git cliff --tag "$VERSION" --output CHANGELOG.md

          # Build release notes for this tag only (stripped header/footer)
          git cliff --latest --strip header > RELEASE_NOTES.md
          echo "path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Bump version in Cargo.toml
        run: |
          # strip leading 'v' (e.g. v0.0.1-alpha.0 -> 0.0.1-alpha.0)
          crate_version="$VERSION"
          crate_version="${crate_version#v}"
          # update the package version field and Cargo.lock in sync
          sed -i "s/^version = \".*\"/version = \"$crate_version\"/" Cargo.toml
          cargo update -p rammal --precise "$crate_version"

      - name: Commit changelog and version bump, create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $VERSION"
          fi
          git tag "$VERSION"
          git push origin HEAD --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          body_path: ${{ steps.cliff.outputs.path }}
          draft: false
          prerelease: ${{ contains(inputs.version, '-alpha') || contains(inputs.version, '-beta') }}

      - name: Trigger docker image build
        run: |
          gh workflow run docker-publish.yml \
            -r "$RELEASE_REF" \
            -f version="$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build and push (e.g. v0.0.1-alpha.0)"
        required: true
        type: string

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  DOCKERHUB_IMAGE: damingerdai/rammal
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/rammal

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)*)?$ ]]; then
            echo "::error::Version must match vX.Y.Z or an alpha/beta version"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.VERSION }}

      - name: Prepare git metadata
        id: gitmeta
        run: |
          # describe: the tag being built (either pushed or manually supplied)
          describe="$VERSION"
          sha=$(git rev-parse HEAD)
          date=$(git show -s --format=%cI HEAD)
          echo "describe=$describe" >> "$GITHUB_OUTPUT"
          echo "sha=$sha"            >> "$GITHUB_OUTPUT"
          echo "date=$date"          >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERGEN_GIT_DESCRIBE=${{ steps.gitmeta.outputs.describe }}
            VERGEN_GIT_SHA=${{ steps.gitmeta.outputs.sha }}
            VERGEN_GIT_COMMIT_DATE=${{ steps.gitmeta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max